name: Build Blueberry LineageOS 16 Bring-up

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout Blueberry port repo
        uses: actions/checkout@v4

      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Build Blueberry bring-up images
        shell: bash
        run: |
          set -eo pipefail

          docker pull ubuntu:20.04

          docker run --rm \
            --privileged \
            --network host \
            -e DEBIAN_FRONTEND=noninteractive \
            -e USER=root \
            -e HOME=/root \
            -v "$GITHUB_WORKSPACE:/port:ro" \
            -v "$GITHUB_WORKSPACE/_android:/build" \
            ubuntu:20.04 \
            bash -lc '
              set -eo pipefail

              apt-get update
              apt-get install -y --no-install-recommends \
                bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
                git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
                lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
                libssl-dev libxml2 libxml2-utils lzop openjdk-8-jdk pngcrush \
                python python3 rsync schedtool squashfs-tools unzip xsltproc zip \
                zlib1g-dev ca-certificates

              git lfs install --system || true
              git config --global user.email "blueberry-build@local"
              git config --global user.name "Blueberry Builder"

              mkdir -p /root/bin /src /build/artifacts
              curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
                -o /root/bin/repo
              chmod +x /root/bin/repo
              export PATH=/root/bin:$PATH

              export USE_CCACHE=1
              export CCACHE_DIR=/build/ccache
              ccache -M 15G || true

              cd /src

              repo init \
                -u https://github.com/LineageOS/android.git \
                -b lineage-16.0 \
                --depth=1

              mkdir -p .repo/local_manifests
              cp /port/blueberry_manifest_lineage16.xml \
                .repo/local_manifests/blueberry.xml

              repo sync \
                -c \
                --force-sync \
                --no-clone-bundle \
                --no-tags \
                -j1 \
                --fail-fast

              rm -rf device/lenovo/blueberry vendor/lenovo/blueberry
              mkdir -p device/lenovo vendor/lenovo

              cp -a /port/lineage16_seed/device/lenovo/blueberry device/lenovo/
              cp -a /port/lineage16_seed/vendor/lenovo/blueberry vendor/lenovo/

              DEVICE=device/lenovo/blueberry

              echo "=== Applying Blueberry bring-up fixes ==="

              # 1) This seed uses the stock prebuilt zImage.
              if ! grep -q "^BOARD_KERNEL_IMAGE_NAME" "$DEVICE/BoardConfig.mk"; then
                sed -i \
                  "/TARGET_PREBUILT_KERNEL/a BOARD_KERNEL_IMAGE_NAME := zImage" \
                  "$DEVICE/BoardConfig.mk"
              fi

              # 2) Android 9 VINTF parser requires an architecture on passthrough HALs.
              if [ -f "$DEVICE/manifest.xml" ]; then
                sed -i \
                  "s#<transport>passthrough</transport>#<transport arch=\"32\">passthrough</transport>#g" \
                  "$DEVICE/manifest.xml"
              fi

              # 3) Keep strict VINTF disabled for first boot/ADB bring-up.
              if [ -f "$DEVICE/lineage_blueberry.mk" ] && \
                 ! grep -q "^PRODUCT_ENFORCE_VINTF_MANIFEST" "$DEVICE/lineage_blueberry.mk"; then
                printf "\n# Temporary bring-up setting\nPRODUCT_ENFORCE_VINTF_MANIFEST := false\n" \
                  >> "$DEVICE/lineage_blueberry.mk"
              fi

              echo "=== Effective BoardConfig kernel section ==="
              grep -n -E "TARGET_PREBUILT_KERNEL|BOARD_KERNEL_IMAGE_NAME|BOARD_KERNEL_BASE|BOARD_KERNEL_CMDLINE" \
                "$DEVICE/BoardConfig.mk" || true

              echo "=== Effective passthrough HALs ==="
              grep -n -B2 -A2 "passthrough" "$DEVICE/manifest.xml" || true

              set +u
              export ALLOW_MISSING_DEPENDENCIES=true

              source build/envsetup.sh
              lunch lineage_blueberry-userdebug

              echo "=== Building boot/system/vendor ==="
              mka -j2 bootimage systemimage vendorimage

              PRODUCT_OUT=out/target/product/blueberry

              for f in boot.img system.img vendor.img vbmeta.img; do
                if [ -f "$PRODUCT_OUT/$f" ]; then
                  cp -v "$PRODUCT_OUT/$f" /build/artifacts/
                fi
              done

              # Useful diagnostics for us before anything gets flashed.
              {
                echo "Blueberry LineageOS 16 bring-up build"
                echo
                echo "Generated:"
                ls -lh /build/artifacts || true
                echo
                echo "Partition-related BoardConfig:"
                grep -E "PARTITION_SIZE|BOARD_KERNEL|TARGET_PREBUILT_KERNEL" \
                  "$DEVICE/BoardConfig.mk" || true
              } > /build/artifacts/BUILD-INFO.txt

              cd /build/artifacts
              sha256sum *.img > SHA256SUMS.txt 2>/dev/null || true

              echo "=== FINAL ARTIFACTS ==="
              ls -lah /build/artifacts
            '

      - name: Verify bring-up artifacts
        shell: bash
        run: |
          set -e
          ls -lah "$GITHUB_WORKSPACE/_android/artifacts"
          test -f "$GITHUB_WORKSPACE/_android/artifacts/boot.img"
          test -f "$GITHUB_WORKSPACE/_android/artifacts/system.img"

      - name: Upload Blueberry bring-up build
        uses: actions/upload-artifact@v4
        with:
          name: blueberry-lineage16-bringup
          path: _android/artifacts/*
          if-no-files-found: error
          retention-days: 7
