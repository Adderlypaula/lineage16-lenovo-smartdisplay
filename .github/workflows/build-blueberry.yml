name: Build Blueberry LineageOS 16

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout Blueberry port repo
        uses: actions/checkout@v4

      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Build LineageOS 16 for Blueberry in Ubuntu 20.04
        shell: bash
        run: |
          set -euxo pipefail

          docker pull ubuntu:20.04

          docker run --rm \
            --privileged \
            --network host \
            -e DEBIAN_FRONTEND=noninteractive \
            -e USER=root \
            -e HOME=/root \
            -v "$GITHUB_WORKSPACE:/port:ro" \
            -v "$GITHUB_WORKSPACE/_android:/build" \
            ubuntu:20.04 \
            bash -lc '
              set -euxo pipefail

              apt-get update
              apt-get install -y --no-install-recommends \
                bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
                git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
                lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
                libssl-dev libxml2 libxml2-utils lzop openjdk-8-jdk pngcrush \
                python python3 rsync schedtool squashfs-tools unzip xsltproc zip zlib1g-dev \
                ca-certificates

              git config --global user.email "blueberry-build@local"
              git config --global user.name "Blueberry Builder"

              mkdir -p /root/bin /src
              curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /root/bin/repo
              chmod +x /root/bin/repo
              export PATH=/root/bin:$PATH

              cd /src
              repo init -u https://github.com/LineageOS/android.git -b lineage-16.0 --depth=1

              mkdir -p .repo/local_manifests
              cp /port/blueberry_manifest_lineage16.xml .repo/local_manifests/blueberry.xml

              repo sync -c --force-sync --no-clone-bundle --no-tags -j2

              rm -rf device/lenovo/blueberry vendor/lenovo/blueberry
              mkdir -p device/lenovo vendor/lenovo

              cp -a /port/lineage16_seed/device/lenovo/blueberry device/lenovo/
              cp -a /port/lineage16_seed/vendor/lenovo/blueberry vendor/lenovo/

              source build/envsetup.sh

              lunch lineage_blueberry-userdebug

              mka -j2 bootimage systemimage vendorimage

              mkdir -p /build/artifacts

              PRODUCT_OUT=out/target/product/blueberry

              for f in boot.img system.img vendor.img; do
                if [ -f "$PRODUCT_OUT/$f" ]; then
                  cp -v "$PRODUCT_OUT/$f" /build/artifacts/
                fi
              done

              ls -lah /build/artifacts
            '

      - name: Upload Blueberry build
        uses: actions/upload-artifact@v4
        with:
          name: blueberry-lineage16-build
          path: _android/artifacts/*
          if-no-files-found: error
          retention-days: 7
